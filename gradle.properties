# Strict supply chain: verification metadata is checked and never written by CI; locks are strict (build-logic sets them).
org.gradle.dependency.verification=strict
# The JDK is the reviewed Temurin 25 on JAVA_HOME; Gradle may not download or auto-detect another one.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
# Reproducible, observable builds. No build cache and no build scans: nothing leaves the machine.
org.gradle.caching=false
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.warning.mode=fail
