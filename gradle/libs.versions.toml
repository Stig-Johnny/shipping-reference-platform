# Every version here has a review in security/reviews/ and an entry in security/allowlist.json.
# Changing a version is a new review (CODEOWNERS: the owner approves changes to this file).
[versions]
structurizr = "6.2.4"
archunit = "1.5.1"
jspecify = "1.0.1"
junit = "5.14.4"
assertj = "3.27.7"
pitest = "1.30.2"
pitest-junit5 = "1.2.3"
errorprone = "2.51.0"
nullaway = "0.14.3"
# The docs tool (tools/docs) only, at build time: security/reviews/maven--docs-tool-scope-extension.md and
# maven--snakeyaml-engine--3.2.md. CommonMark is the version Error Prone already brings.
commonmark = "0.29.0"
snakeyaml-engine = "3.2"
# Not used directly: lifts Structurizr's transitive Guava 33.6.0-jre past GHSA-xxph-c9ww-hj94 (OSV, 2026-11-06).
guava = "33.7.2-jre"
# Not used directly: in tools/docs, aligns the slf4j-api 1.7.36 that httpclient5 brings (through Structurizr) to the
# version reviewed with Structurizr's transitives, which the kit already resolves.
slf4j = "2.0.19"
# The shipping API (apps/shipping-api): the Spring Boot and Spring Modulith BOMs, and the contract-test validator.
spring-boot = "4.1.2"
spring-modulith = "2.1.2"
json-schema-validator = "3.0.9"

[libraries]
structurizr-dsl = { module = "com.structurizr:structurizr-dsl", version.ref = "structurizr" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
