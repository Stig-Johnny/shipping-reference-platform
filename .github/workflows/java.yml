# java: build and test with the reviewed toolchain, after the base branch's allowlist checker has passed the candidate.
# Every dependency resolves from the lockfiles and is checked against gradle/verification-metadata.xml; CI never writes
# either of them. GRADLE_USER_HOME starts empty on every run, because the wrapper checks the distribution's SHA-256
# only when it downloads it.
name: java

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# bash -eo pipefail in every run step (without it, a pipeline takes its last command's exit code).
defaults:
  run:
    shell: bash

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The base branch supplies the tooling that judges the candidate: the JDK staging script and the allowlist
      # checker. Nothing from the candidate runs until the checker has passed it. A pull request can still change this
      # workflow; preflight, which runs from the base branch, is the gate it cannot change.
      - name: Check out the trusted tooling (the base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          path: candidate
          persist-credentials: false

      - name: Stage the reviewed JDK (the base branch's script and checksum)
        id: jdk
        run: base/tools/ci/stage-temurin.sh "$RUNNER_TEMP/jdk"

      - name: Install the staged JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0, reviewed
        with:
          distribution: jdkfile
          jdk-file: ${{ steps.jdk.outputs.jdk-file }}
          java-version: '25.0.5'
          architecture: x64
          token: ''

      - name: Check the candidate against the allowlist before any of its code runs
        id: allowlist
        # 1 = findings and 2 = the check could not complete both fail the job (pipefail).
        run: java base/tools/policy/PolicyCheck.java candidate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test the candidate's allowlist checker (the JDK alone)
        # The candidate's tests of its own tools/policy/PolicyCheck.java, which may run now that the base branch's
        # checker has passed the candidate. They build their repositories in temporary directories; a failed case
        # fails the job.
        working-directory: candidate
        run: java tools/policy/PolicyCheckTest.java

      - name: Verify the Gradle wrapper before running it
        working-directory: candidate
        run: echo "3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Test the generated-password scan with negative fixtures
        working-directory: candidate
        run: bash tools/ci/check-generated-password-test.sh

      - name: Build and test
        working-directory: candidate
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        # The output is also kept for the next step's scan. pipefail (the default shell above) keeps Gradle's exit
        # status, so a failed build or test still fails this step.
        run: ./gradlew --no-daemon --console=plain check 2>&1 | tee "$RUNNER_TEMP/gradle-check.log"

      - name: Refuse Spring Boot's generated security password in any build or test output
        # Spring Security's review, condition 3 (security/reviews/maven--spring-security--7.1.2.md): Spring Boot's
        # generated user must never exist, and Boot logs its password at WARN. The scan reads the build's console output
        # and every file of every test result and test report, which hold the tests' own output. It also runs after a
        # failed build, and it can only fail the job, never make a failed build pass. The candidate's script may run
        # only after the base branch's allowlist check has passed.
        if: ${{ !cancelled() && steps.allowlist.outcome == 'success' }}
        run: bash candidate/tools/ci/check-generated-password.sh candidate "$RUNNER_TEMP/gradle-check.log"

      - name: Refuse symbolic links before uploading reports
        # Any link under libs/ or apps/, the report directories themselves included: the upload follows links.
        id: report_guard
        if: ${{ !cancelled() }}
        run: |
          links="$(find candidate/libs candidate/apps -type l -print -quit 2>/dev/null || true)"
          if [[ -n "$links" ]]; then
            echo "::error::A symbolic link was found under libs/ or apps/; refusing to upload the reports."
            exit 1
          fi

      - name: Upload the reports
        # Only when the guard ran and passed: always() would upload even after the guard failed.
        if: ${{ !cancelled() && steps.report_guard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, reviewed
        with:
          name: java-reports
          path: |
            candidate/libs/*/build/reports/
            candidate/apps/*/build/reports/
          include-hidden-files: false
          archive: true
          overwrite: false
          retention-days: 14
          if-no-files-found: ignore

  mutation:
    # PIT runs only here, on a disposable GitHub-hosted worker. Its parent JVM listens on all interfaces and accepts
    # its workers' first connection without authentication (security/reviews/maven--pitest-command-line--1.30.2.md,
    # condition 2), so the pitest task never runs on a developer machine whose firewall lets inbound connections
    # reach java. No secret or token is in this job's environment (condition 3). As in `java`, the base branch supplies
    # the tooling, and nothing from the candidate runs until the base branch's checker has passed it.
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the trusted tooling (the base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          path: candidate
          persist-credentials: false

      - name: Stage the reviewed JDK (the base branch's script and checksum)
        id: jdk
        run: base/tools/ci/stage-temurin.sh "$RUNNER_TEMP/jdk"

      - name: Install the staged JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0, reviewed
        with:
          distribution: jdkfile
          jdk-file: ${{ steps.jdk.outputs.jdk-file }}
          java-version: '25.0.5'
          architecture: x64
          token: ''

      - name: Check the candidate against the allowlist before any of its code runs
        # 1 = findings and 2 = the check could not complete both fail the job (pipefail).
        run: java base/tools/policy/PolicyCheck.java candidate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the Gradle wrapper before running it
        working-directory: candidate
        run: echo "3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Mutation testing of the contract kit (at least 90 % killed)
        working-directory: candidate
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: ./gradlew --no-daemon --console=plain :libs:c4-contract-kit:pitest

      - name: Refuse symbolic links before uploading the report
        # Any link under libs/, the report directory itself included: the upload follows links.
        id: report_guard
        if: ${{ !cancelled() }}
        run: |
          links="$(find candidate/libs -type l -print -quit 2>/dev/null || true)"
          if [[ -n "$links" ]]; then
            echo "::error::A symbolic link was found under libs/; refusing to upload the mutation report."
            exit 1
          fi

      - name: Upload the mutation report
        # Only when the guard ran and passed: always() would upload even after the guard failed.
        if: ${{ !cancelled() && steps.report_guard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, reviewed
        with:
          name: mutation-report
          path: candidate/libs/*/build/reports/pitest/
          include-hidden-files: false
          archive: true
          overwrite: false
          retention-days: 14
          if-no-files-found: ignore
