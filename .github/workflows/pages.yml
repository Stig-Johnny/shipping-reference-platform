# pages: build the documentation site on main, scan it, and publish it on GitHub Pages (ADR 0011).
# Three jobs, so that the job that runs the tests holds no publication privilege, and the jobs that hold one run no
# test. Each runs on a commit that is already on main, and stages the reviewed JDK and runs the allowlist check, its
# trusted bootstrap, then verifies the Gradle wrapper before it runs Gradle.
#   test    No environment, no secret, read-only, on ubuntu-24.04 under the container engine's review: it runs every
#           project's tests (the database tests start the reviewed PostgreSQL) while it checks the docs and builds the
#           site, as the java check does, then hands this run's JUnit reports and the site's digest to the build job.
#   build   In the github-pages environment, whose secret is the scan dictionary. It builds the site again from the
#           same commit and those reports, without running the tests, requires the test job's digest, scans the site,
#           re-checks Mermaid's SHA-256, refuses links and hidden files, and only then uploads the site directory.
#   deploy  One step and the only write permissions.
# The conditions of the Pages actions' reviews and of the runner review in security/reviews/ apply to every line here.
name: pages

on:
  push:
    branches: [main]
  # The github-pages environment's branch policy (OpenTofu) allows main only; every job also checks the ref.
  workflow_dispatch:

permissions: {}

# bash -eo pipefail in every run step (without it, a pipeline takes its last command's exit code).
defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: test
    if: ${{ github.ref == 'refs/heads/main' }}
    # The runner review's scope: GitHub-hosted ubuntu-24.04 exactly, no environment, no secret, read-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      reports: ${{ steps.handover.outputs.reports }}
      reports-sha256: ${{ steps.handover.outputs.reports-sha256 }}
      site-sha256: ${{ steps.handover.outputs.site-sha256 }}
    steps:
      # On a push to main the trusted base and the candidate are the same commit, so one checkout is enough.
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage the reviewed JDK
        id: jdk
        run: tools/ci/stage-temurin.sh "$RUNNER_TEMP/jdk"

      - name: Install the staged JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0, reviewed
        with:
          distribution: jdkfile
          jdk-file: ${{ steps.jdk.outputs.jdk-file }}
          java-version: '25.0.5'
          architecture: x64
          token: ''

      - name: Check the commit against the allowlist (trusted bootstrap)
        # 1 = findings and 2 = the check could not complete both fail the job (pipefail).
        run: java tools/policy/PolicyCheck.java . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the Gradle wrapper before running it
        run: echo "3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Check the container engine against its review before any container runs
        # The runner, Ubuntu and Docker Engine versions and runc, recorded in the job summary; a loopback-only daemon;
        # an empty registry configuration. A mismatch stops the job: another version needs a review, not a looser check.
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: tools/ci/container-engine.sh prepare

      - name: Stage the reviewed PostgreSQL image by digest
        id: stage
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: tools/ci/container-engine.sh stage

      - name: Run every project's tests, the database tests included, check the docs and build the site
        # :tools:docs:check and :tools:docs:site run after the tests of every project with test sources and read their
        # reports, so the site's evidence is this build's; with -PdatabaseEvidence=true they also run databaseTest and
        # require its reports, passing and unskipped. :tools:docs:site empties tools/docs/build/site and writes it
        # again from the sources of this commit.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
          SRP_CONTAINER_ENGINE: github-ubuntu-24.04
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          TESTCONTAINERS_CHECKS_DISABLE: 'true'
        run: ./gradlew --no-daemon --console=plain :apps:shipping-api:databaseTest :tools:docs:check :tools:docs:site -PdatabaseEvidence=true

      - name: Check that only the reviewed image ran, then remove the test containers
        # After the tests, whatever their outcome, once the image was staged: the image set, the containers made, no
        # copy into one; then the sweep.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: tools/ci/container-engine.sh verify

      - name: Hand this run's test reports and the site's digest to the build job
        id: handover
        run: tools/ci/site-handover.sh send

  build:
    name: build
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The scan dictionary is a secret of this environment, which only main may use.
    environment: github-pages
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage the reviewed JDK
        id: jdk
        run: tools/ci/stage-temurin.sh "$RUNNER_TEMP/jdk"

      - name: Install the staged JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0, reviewed
        with:
          distribution: jdkfile
          jdk-file: ${{ steps.jdk.outputs.jdk-file }}
          java-version: '25.0.5'
          architecture: x64
          token: ''

      - name: Check the commit against the allowlist (trusted bootstrap)
        # 1 = findings and 2 = the check could not complete both fail the job (pipefail).
        run: java tools/policy/PolicyCheck.java . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the Gradle wrapper before running it
        run: echo "3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Take over the test job's reports
        # This run's JUnit reports, checked against their SHA-256 and unpacked only as report files into a checkout
        # that has none: the evidence the site shows is the test job's, never an earlier build's.
        env:
          REPORTS: ${{ needs.test.outputs.reports }}
          REPORTS_SHA256: ${{ needs.test.outputs.reports-sha256 }}
        run: tools/ci/site-handover.sh receive

      - name: Build the site from this commit and those reports, without running the tests again
        # -x test -x databaseTest: every test ran in the test job of this run, which has no environment and no secret;
        # the database tests may not run here. -PdatabaseEvidence=true still requires their reports, passing and
        # unskipped. :tools:docs:site empties tools/docs/build/site and writes it again.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: ./gradlew --no-daemon --console=plain :tools:docs:site -x test -x databaseTest -PdatabaseEvidence=true

      - name: Require the site that the test job built
        env:
          SITE_SHA256: ${{ needs.test.outputs.site-sha256 }}
        run: tools/ci/site-handover.sh compare

      - name: Scan the site before publication
        # The only step that receives the dictionary. The scan prints rule IDs and files, never a value or a term, and
        # fails closed when the dictionary is missing or empty; any finding stops the job here.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
          PUBLIC_SCAN_DICTIONARY: ${{ secrets.PUBLIC_SCAN_DICTIONARY }}
        run: ./gradlew --no-daemon --console=plain :tools:docs:scanSite

      - name: Re-check the Mermaid bundle in the site
        run: echo "581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8  tools/docs/build/site/assets/mermaid/11.17.2/mermaid.min.js" | sha256sum --check --strict

      - name: Refuse links and hidden files in the site
        # The upload's tar dereferences symbolic and hard links and would publish their targets' content. Each search
        # runs on its own; a search that fails fails the job, and its errors are not printed, since they name paths.
        run: |
          site=tools/docs/build/site
          if [[ ! -f "$site/index.html" ]]; then
            echo "::error::There is no built site to upload."
            exit 1
          fi
          if ! links="$(find "$site" -type l -print -quit 2>/dev/null)"; then
            echo "::error::The site directory could not be searched for symbolic links."
            exit 1
          fi
          if ! hard_links="$(find "$site" -type f -links +1 -print -quit 2>/dev/null)"; then
            echo "::error::The site directory could not be searched for hard links."
            exit 1
          fi
          if ! hidden="$(find "$site" -mindepth 1 -name '.*' -print -quit 2>/dev/null)"; then
            echo "::error::The site directory could not be searched for hidden files."
            exit 1
          fi
          if [[ -n "$links" || -n "$hard_links" ]]; then
            echo "::error::The site directory contains a symbolic link or a hard-linked file; refusing to upload it."
            exit 1
          fi
          if [[ -n "$hidden" ]]; then
            echo "::error::The site directory contains a hidden file; refusing to upload it."
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0, reviewed
        with:
          path: tools/docs/build/site

  deploy:
    name: deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, reviewed
