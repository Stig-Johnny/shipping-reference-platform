controls:
  # Each control lists the deliberate failure (negative fixture) that proves it catches what it advertises.
  - id: control.c4-divergence
    title: A dependency between modules that the C4 model does not declare fails the build.
    where: libs/c4-contract-kit, apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ConformanceDivergenceTest, ArchitectureConformanceTest]
    acceptanceTests: [ConformanceDivergenceTest, ArchitectureConformanceTest]
    negativeFixture: The fixtures of ConformanceDivergenceTest; on the API's own classes, the model without quotes -> tenants (ArchitectureConformanceTest). Planned, the demo pull request "undeclared dependency", a quotes class referencing shipments.api.ShipmentId.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.c4-absence
    title: A REQUIRED relationship without any static reference fails the build.
    where: libs/c4-contract-kit, apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ConformanceAbsenceTest, ArchitectureConformanceTest]
    acceptanceTests: [ConformanceAbsenceTest, ArchitectureConformanceTest]
    negativeFixture: The fixtures of ConformanceAbsenceTest, and the repository's model without the API's classes, in which quotes -> tenants is absent (RepositoryWorkspaceTest). Planned, the demo pull request "missing required edge", which removes ShipmentAuditListener's dependency on shipments.api.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.no-static-evidence-report
    title: A PERMITTED relationship without references is reported as "no static evidence", never as unused, and does not fail.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [ReportNoStaticEvidenceTest]
    acceptanceTests: [ReportNoStaticEvidenceTest]
    negativeFixture: A fixture with built, nonempty audit and quotes components, a PERMITTED audit -> quotes relationship, and no static reference between them.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.model-validation
    title: Restricted DSL parsing and mapping validation (overlaps, empty or uncovered mappings, planned code, tag mismatches, cycles, forbidden directives).
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [RestrictedDslParserTest, MappingValidationTest]
    acceptanceTests: [RestrictedDslParserTest, MappingValidationTest]
    negativeFixture: Fixture models with !include, overlapping packages, a planned component with a class, an invalid contract.mode value.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.bytecode-evidence
    title: Class, member, reference kind and source line evidence for every dependency, including inheritance, annotations, generics and lambdas.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [BytecodeEvidenceTest]
    acceptanceTests: [BytecodeEvidenceTest]
    negativeFixture: Fixture classes for each reference kind; a missing kind fails the test.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.deterministic-reports
    title: Byte-identical JSON and Markdown reports for identical inputs, written before an assertion fails.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [ReportDeterminismTest, ConformanceAssertionsTest, SelfConformanceTest]
    acceptanceTests: [ReportDeterminismTest, ConformanceAssertionsTest, SelfConformanceTest]
    negativeFixture: Shuffled input order must produce the same bytes.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.modulith-verification
    title: No access to another module's internal packages and no module cycles.
    where: apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ModularityTest]
    acceptanceTests: [ModularityTest]
    negativeFixture: A shipments class importing quotes.internal.domain.Quote, and two modules that use each other (fixtures of ModularityTest).
    docs: docs/adr/0003-modular-monolith-with-spring-modulith-and-hexagonal-modules.md
  - id: control.hexagonal-layering
    title: Domain code free of Spring, Jakarta, JDBC and adapters; only the five allowed packages per module; @NullMarked everywhere.
    where: apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [HexagonalLayeringTest]
    acceptanceTests: [HexagonalLayeringTest]
    negativeFixture: A domain class annotated with a Spring stereotype; one fixture for each other rule (fixtures of HexagonalLayeringTest).
    docs: docs/adr/0003-modular-monolith-with-spring-modulith-and-hexagonal-modules.md
  - id: control.table-ownership
    title: Each module maps only tables in its own schema.
    where: apps/shipping-api
    check: java
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [TableOwnershipTest]
    negativeFixture: An audit entity mapped to a table in schema shipments.
    docs: docs/adr/0005-postgresql-spring-data-jdbc-flyway-and-forced-rls.md
  - id: control.migrations
    title: Migrations apply cleanly to an empty database as the owner role; the runtime role cannot run DDL.
    where: apps/shipping-api
    check: java
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [MigrationsIntegrationTest]
    negativeFixture: A DDL statement attempted as shipping_app.
    docs: docs/adr/0005-postgresql-spring-data-jdbc-flyway-and-forced-rls.md
  - id: control.http-contract
    title: Exercised HTTP responses, including framework problems, conform to contracts/shipping.openapi.yaml.
    where: apps/shipping-api
    check: java
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [QuotesHttpContractTest, ShipmentsHttpContractTest, TenantsHttpContractTest, ProblemDetailsHttpContractTest]
    negativeFixture: A response with an undocumented member fails validation.
    docs: docs/adr/0004-contract-first-openapi-with-rfc-9457-problems.md
  - id: control.web-import-boundaries
    title: Web app import boundaries and cycles (dependency-cruiser deferred).
    where: tools/web-imports, apps/shipping-web
    check: web
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [check-imports.test.mjs]
    negativeFixture: Fixture files with a cycle and a cross-feature internal import.
    docs: docs/adr/0009-react-workbench-with-a-generated-client.md
  - id: control.dependency-allowlist
    title: No third-party component is downloaded or run on the sanctioned CI path unless reviewed and allowlisted.
    where: tools/policy, security/
    check: preflight
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [AllowlistCheckTest, GradleVerificationCheckTest, NpmLockCheckTest, WorkflowPinCheckTest, ApprovalBindingTest, StrictJsonParserTest]
    negativeFixture: Demo pull request adding an unreviewed dependency; it is stopped before the build.
    enforcedSubset: Current enforcement covers preflight, dependency verification and acceptance-digest checks.
    plannedRemainder: Schema validation, policy tests and approval binding remain planned.
    docs: docs/adr/0007-dependency-allowlist-and-pre-use-enforcement.md
  - id: control.risk-classification
    title: Risk level from base-branch policy; level 3 waits for the owner's approval of the current head.
    where: tools/policy, policy/
    check: risk-approval
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [RiskClassifierTest, CodeownersRiskConsistencyTest]
    negativeFixture: Demo pull requests "pricing change requires owner approval" and "model weakening awaits human".
    docs: docs/adr/0008-risk-levels-0-to-3.md
  - id: control.mutation-testing
    title: At least 80 % killed mutants on changed lines, 90 % for pricing and checker logic; zero mutants reports "not applicable".
    where: build-logic
    check: mutation
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [MutationThresholdTest]
    negativeFixture: A fixture PIT report below threshold fails; one with zero mutants reports not applicable.
    docs: README.md
  - id: control.brain-check
    title: Generated brain and docs are deterministic, within budget, and never claim unevidenced capabilities.
    where: tools/docs
    check: java
    status: shipped
    target: v0.1
    evidence: [BrainGeneratorTest, BrainCheckTest]
    evidenceLabel: documentation-tool
    acceptanceTests: [BrainGeneratorTest, BrainCheckTest]
    negativeFixture: A shipped capability without evidence; a hand-edited BRAIN.md.
    docs: docs/adr/0011-java-documentation-tool-and-publication.md

  - id: control.publication-scan
    title: The public site is scanned before every upload, fails closed without its dictionary, and names only rules and files.
    where: tools/docs, .github/workflows/pages.yml
    check: build
    status: shipped
    target: v0.1
    evidence: [PublicationScannerTest, PagesWorkflowTest]
    evidenceLabel: publication-scanner
    acceptanceTests: [PublicationScannerTest, PagesWorkflowTest]
    negativeFixture: One value per rule; a missing dictionary; a stale exception; a symbolic link in the site.
    docs: docs/adr/0011-java-documentation-tool-and-publication.md
