# Capabilities and controls of shipping-reference-platform, with the evidence for each.
#
# Read by tools/docs (ADR 0011); `./gradlew :tools:docs:check` validates this file. Changing a status is a claim and is
# reviewed.
#
# Fields
#   id               Stable identifier, "<module>.<kebab-name>" for capabilities, "control.<kebab-name>" for controls.
#   module           A C4 component contract.id (quotes, shipments, tenants, audit, orders, tracking, returns), or
#                    "web" for the Web app container. Controls use `where` instead.
#   status           The truth at the current commit:
#                      shipped  every acceptance test exists and passes in the required checks;
#                      partial  at least one acceptance test exists and passes; the remaining proof is pending;
#                      planned  no passing acceptance evidence is claimed yet.
#   target           v0.1 (committed for the first release) or later.
#   evidence         Test class names (Java) or test file names (TypeScript, JavaScript) that exist and pass at this
#                    commit, or the string "none yet". Must be "none yet" when status is planned. tools/docs counts a
#                    test as passing only when its JUnit report in the same build shows tests run and none failed,
#                    errored or was skipped; TypeScript tests have no such report yet.
#   acceptanceTests  The tests that must exist and pass before status may become shipped. Implementers create
#                    them with exactly these names, red first.
#   docs             The document that specifies the capability.
#   enforcedSubset   Optional, for a control that is not shipped: the part enforced today, in one sentence. It never
#                    changes the status; the document named in docs gives the details.
#   plannedRemainder Optional, for a control that is not shipped: the part still planned, in one sentence.
#   evidenceLabel    Optional, for a capability or control with evidence: what its tests are called in a sentence
#                    ("the documentation-tool tests"), so that a decision's page can name them in a few words.
#   actors           For a capability, required: the people and external systems of the model that take part in it,
#                    by their identifiers in architecture/workspace.dsl (clerk, admin, webshop, carrier), or [] to
#                    declare none; an empty list does not establish how the capability is triggered. tools/docs fails
#                    unless the model relates each actor to the capability's module, directly or through an element
#                    it uses. The site's use case overview draws them. Controls name none.
#
# A pull request that adds passing acceptance tests moves their names into `evidence` and changes the status in the
# same commit; `:tools:docs:checkGenerated` rejects a shipped or partial status whose evidence does not exist or did
# not pass, and never shows a planned capability as available because its package exists. The docs tool's own
# controls are shipped, and so are the controls of libs/c4-contract-kit, divergence and absence included now that
# ArchitectureConformanceTest checks :apps:shipping-api, and the two module checks of the API. The web import check is
# partial: each of its rules fails its negative fixture, and WebArchitectureConformanceTest runs it on
# apps/shipping-web in every build, but every web part is still planned, so it has checked no import of the web app
# yet. The API's scenario checks
# are partial: their in-process scenarios and negative fixtures pass, while the first booking, replay and label
# scenarios and the observation of HTTP and SQL are planned. Of the product, the
# synthetic tariff and quote expiry are shipped. Creating and reading a quote, the offer lookup, demo authentication
# and the current membership remain partial. Ordinary local evidence covers the memory/HTTP implementation.
# Recorded CI run 42612173809 separately proves all ten PostgreSQL classes (45 tests, no failures/skips),
# including the demo HTTP flow, migrations, RLS and adapter/concurrency contracts; see docs/demos/94-demo-profile.md.
# Database reports are deliberately not read by an ordinary local build. Keep this build's evidence distinct
# from that recording; do not import a previous CI report as current-build evidence.
# Cancellation, durable publication, flags and workbench behavior remain planned. ShipmentTest proves booking,
# not cancellation. The HTTP contract and dependency controls remain partial; check 8 is a PARTIAL static lint.
# MigrationFilesTest supplies local file-pairing evidence; CI additionally ran migration and runtime-role proofs.

