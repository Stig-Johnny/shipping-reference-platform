# Capabilities and controls of shipping-reference-platform, with the evidence for each.
#
# Read by tools/docs (ADR 0011); `./gradlew :tools:docs:check` validates this file. Changing a status is a claim and is
# reviewed.
#
# Fields
#   id               Stable identifier, "<module>.<kebab-name>" for capabilities, "control.<kebab-name>" for controls.
#   module           A C4 component contract.id (quotes, shipments, tenants, audit, orders, tracking, returns), or
#                    "web" for the Web app container. Controls use `where` instead.
#   status           The truth at the current commit:
#                      shipped  every acceptance test exists and passes in the required checks;
#                      partial  at least one acceptance test exists and passes, others are missing;
#                      planned  no acceptance test exists yet.
#   target           v0.1 (committed for the first release) or later.
#   evidence         Test class names (Java) or test file names (TypeScript, JavaScript) that exist and pass at this
#                    commit, or the string "none yet". Must be "none yet" when status is planned. tools/docs counts a
#                    test as passing only when its JUnit report in the same build shows tests run and none failed,
#                    errored or was skipped; TypeScript tests have no such report yet.
#   acceptanceTests  The tests that must exist and pass before status may become shipped. Implementers create
#                    them with exactly these names, red first.
#   docs             The document that specifies the capability.
#   enforcedSubset   Optional, for a control that is not shipped: the part enforced today, in one sentence. It never
#                    changes the status; the document named in docs gives the details.
#   plannedRemainder Optional, for a control that is not shipped: the part still planned, in one sentence.
#   evidenceLabel    Optional, for a capability or control with evidence: what its tests are called in a sentence
#                    ("the documentation-tool tests"), so that a decision's page can name them in a few words.
#
# A pull request that adds passing acceptance tests moves their names into `evidence` and changes the status in the
# same commit; `:tools:docs:checkGenerated` rejects a shipped or partial status whose evidence does not exist or did
# not pass, and never shows a planned capability as available because its package exists. The docs tool's own
# controls are shipped, and so are the controls of libs/c4-contract-kit, divergence and absence included now that
# ArchitectureConformanceTest checks :apps:shipping-api, and the two module checks of the API. Of the product, the
# quotes module's domain and application tests pass: the synthetic tariff and quote expiry are shipped, creating a
# quote and the offer lookup are partial, since their HTTP and database tests are planned. So do the shipments
# module's booking tests: booking from an offer and idempotent booking are partial, since their HTTP and database
# tests are planned. ShipmentTest passes too, but it asserts only what booking produces, not cancellation, so
# shipments.cancel-shipment stays planned. Every other status is planned and its evidence is "none yet".

schemaVersion: 1

