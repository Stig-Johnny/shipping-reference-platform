controls:
  # Each control lists the deliberate failure (negative fixture) that proves it catches what it advertises.
  - id: control.c4-divergence
    title: A dependency between modules that the C4 model does not declare fails the build.
    where: libs/c4-contract-kit, apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ConformanceDivergenceTest, ArchitectureConformanceTest]
    acceptanceTests: [ConformanceDivergenceTest, ArchitectureConformanceTest]
    negativeFixture: The fixtures of ConformanceDivergenceTest; on the API's own classes, the model without quotes -> tenants (ArchitectureConformanceTest). Planned, the demo pull request "undeclared dependency", a quotes class referencing shipments.api.ShipmentId.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.c4-absence
    title: A REQUIRED relationship without any static reference fails the build.
    where: libs/c4-contract-kit, apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ConformanceAbsenceTest, ArchitectureConformanceTest]
    acceptanceTests: [ConformanceAbsenceTest, ArchitectureConformanceTest]
    negativeFixture: The fixtures of ConformanceAbsenceTest, and the repository's model without the API's classes, in which quotes -> tenants is absent (RepositoryWorkspaceTest). Planned, the demo pull request "missing required edge", which removes ShipmentAuditListener's dependency on shipments.api.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.no-static-evidence-report
    title: A PERMITTED relationship without references is reported as "no static evidence", never as unused, and does not fail.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [ReportNoStaticEvidenceTest]
    acceptanceTests: [ReportNoStaticEvidenceTest]
    negativeFixture: A fixture with built, nonempty audit and quotes components, a PERMITTED audit -> quotes relationship, and no static reference between them.
    docs: docs/adr/0002-c4-model-is-the-structural-authority.md
  - id: control.model-validation
    title: Restricted DSL parsing and mapping validation (overlaps, empty or uncovered mappings, planned code, tag mismatches, cycles, forbidden directives).
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [RestrictedDslParserTest, MappingValidationTest]
    acceptanceTests: [RestrictedDslParserTest, MappingValidationTest]
    negativeFixture: Fixture models with !include, overlapping packages, a planned component with a class, an invalid contract.mode value.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.bytecode-evidence
    title: Class, member, reference kind and source line evidence for every dependency, including inheritance, annotations, generics and lambdas.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [BytecodeEvidenceTest]
    acceptanceTests: [BytecodeEvidenceTest]
    negativeFixture: Fixture classes for each reference kind; a missing kind fails the test.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.deterministic-reports
    title: Byte-identical JSON and Markdown reports for identical inputs, written before an assertion fails.
    where: libs/c4-contract-kit
    check: java
    status: shipped
    target: v0.1
    evidence: [ReportDeterminismTest, ConformanceAssertionsTest, SelfConformanceTest]
    acceptanceTests: [ReportDeterminismTest, ConformanceAssertionsTest, SelfConformanceTest]
    negativeFixture: Shuffled input order must produce the same bytes.
    docs: libs/c4-contract-kit/AGENTS.md
  - id: control.modulith-verification
    title: No access to another module's internal packages and no module cycles.
    where: apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [ModularityTest]
    acceptanceTests: [ModularityTest]
    negativeFixture: A shipments class importing quotes.internal.domain.Quote, and two modules that use each other (fixtures of ModularityTest).
    docs: docs/adr/0012-first-runnable-slice-with-a-plain-typescript-workbench-and-spring-jdbc.md
  - id: control.hexagonal-layering
    title: Domain code free of Spring, Jakarta, JDBC and adapters; only the five allowed packages per module; @NullMarked everywhere.
    where: apps/shipping-api
    check: java
    status: shipped
    target: v0.1
    evidence: [HexagonalLayeringTest]
    acceptanceTests: [HexagonalLayeringTest]
    negativeFixture: A domain class annotated with a Spring stereotype; one fixture for each other rule (fixtures of HexagonalLayeringTest).
    docs: docs/adr/0012-first-runnable-slice-with-a-plain-typescript-workbench-and-spring-jdbc.md
  - id: control.scenario-conformance
    title: A scenario view's evaluated steps are checked against one recording; missing steps, recorded unexpected interactions, wrong order and drift from exact known coverage debt fail the build; known gaps prevent conformance.
    where: apps/shipping-api, architecture/scenarios
    check: java
    status: partial
    target: v0.1
    evidence: [QuoteScenarioTest, TenantDenialScenarioTest, ScenarioFixturesTest, CoverageBypassTest, ReachabilityTest, SidecarValidationTest, ScenarioModelTest, ScenarioReportTest, CoverageLedgerTest]
    acceptanceTests: [QuoteScenarioTest, TenantDenialScenarioTest, ScenarioFixturesTest, CoverageBypassTest, ReachabilityTest, SidecarValidationTest, ScenarioModelTest, ScenarioReportTest, CoverageLedgerTest, FirstBookingScenarioTest, BookingReplayScenarioTest, LabelScenarioTest]
    negativeFixture: CoverageLedgerTest rejects new Spring accesses, removed ledger entries, changed descriptors, disappeared gaps and duplicates; CoverageBypassTest rejects an additional Spring access with an already ledgered owner/member. Altered implementations in ScenarioFixturesTest, a removed call that keeps the outcome (missing step), an added call along a permitted relationship (unexpected interaction), two swapped interactions (order violation), a disabled call observer and a disabled publication observer (coverage gaps), an AFTER_COMMIT publication that runs before any commit (coverage gap), and two interleaved runs that must pass; nine implementations in CoverageBypassTest (coverage gaps), including virtual-thread and pre-existing-executor work released after close; shared receivers and containers in both module traversal orders in ReachabilityTest; a repeated signature with a varying cardinality in SidecarValidationTest (refused).
    enforcedSubset: In process on the built modules, four declared steps of the quote and tenant-denial scenarios are verified against recorded interactions (three module API calls and one event publication); the other eight steps are counted as not evaluated. The accepted ledger has 215 distinct known gaps (115 HTTP/security Spring accesses, 94 JDBC accesses and six factory parameters), retained as refusals; the expected report is COVERAGE_INCOMPLETE, with the JDBC debt classification accepted by the ledger reader (ADR 0013); an exact classified ledger tagged phase 3 / option 2 rejects new, changed, duplicate and disappeared findings, while all other bounded refusals remain build blockers; unexamined code, transient receivers, driver-supplied references and work after close remain limits (docs/gaps.md section 6). The tenant-denial outcome (rejected as an unknown quote, nothing stored for the other tenant) is asserted by the test apart from step verification.
    plannedRemainder: Phase 3 / option 2 closes the 215 distinct known gaps through production factory witnesses and concrete Spring receiver/callback coverage; the first booking, booking replay and label scenarios, HTTP exchanges, database steps observed through JDBC, listener executions, and commits observed so that AFTER_COMMIT steps are evaluated instead of refused.
    docs: docs/adr/0013-scenario-views-are-checked-against-recorded-interactions.md
  - id: control.external-imports
    title: External dependencies reported by ArchUnit 1.5.1 from API main or test outputs have an approved provider or a verified repository-owned project provider, and are on the caller's layer whitelist.
    where: apps/shipping-api, build-logic
    check: java
    status: partial
    target: v0.1
    evidence: [ExternalImportPolicyTest]
    acceptanceTests: [ExternalImportPolicyTest, ExternalImportSourceTest, ProviderIndexScopeTest]
    negativeFixture: A domain class that uses Spring; production code that uses AssertJ; sun.misc.Unsafe, jdk.internal.misc.Unsafe and java.awt.peer, which java.desktop does not export; a class from an artifact reviewed for another project only; a class that no artifact provides, and one that two provide; @Transactional on an api type; an external class under the API namespace; artifacts colliding with main/test outputs; included-build and unverified project providers; missing, changed or withdrawn alias approval (fixtures of ExternalImportPolicyTest).
    enforcedSubset: Dependencies reported by ArchUnit 1.5.1 are classified using actual main/test output ownership, the provider index and JDK module descriptors, then checked against the caller's whitelist. Artifact collisions fail. Maven approval checks project, configuration, expiry and file, comparing SHA-256 where the review records a hash. The Maven-review exemption requires a verified repository-owned project output with root-build identity and an exact registered output path; other project providers fail.
    plannedRemainder: Source analysis for compiler-erased references (such as inlined constants) and retained bytecode that ArchUnit does not report (such as type-use annotations) remains planned (ExternalImportSourceTest), as does scope enforcement for every artifact on the classpaths, used or not (ProviderIndexScopeTest).
    docs: README.md
  - id: control.table-ownership
    title: Each module's adapters run SQL only against tables in its own schema.
    where: apps/shipping-api
    check: java
    status: planned
    target: v0.1
    evidence: none yet
    acceptanceTests: [TableOwnershipTest]
    negativeFixture: An audit adapter statement that reads shipments.shipment.
    docs: docs/adr/0012-first-runnable-slice-with-a-plain-typescript-workbench-and-spring-jdbc.md
  - id: control.migrations
    title: Migrations apply cleanly to an empty database as the owner role, each down script restores the previous catalog, and the runtime role cannot run DDL.
    where: apps/shipping-api
    check: java
    # Only file pairing is local evidence; database proofs passed in the separately recorded CI run.
    status: partial
    target: v0.1
    evidence: [MigrationFilesTest]
    evidenceLabel: Local paired-file checks; up/down execution and runtime-role DDL denial are separately recorded CI evidence.
    acceptanceTests: [MigrationFilesTest, MigrationsIntegrationTest, MigrationRoundTripTest]
    negativeFixture: DDL statements attempted as shipping_app; an applied migration edited afterwards; a down script without its last statement.
    docs: docs/adr/0016-down-scripts-proven-in-ci-production-rolls-forward.md
  - id: control.http-contract
    title: Exercised HTTP responses, including framework problems, conform to contracts/shipping.openapi.yaml.
    where: apps/shipping-api
    check: java
    status: partial
    target: v0.1
    evidence: [QuotesHttpContractTest, ShipmentsHttpContractTest, TenantsHttpContractTest, ProblemDetailsHttpContractTest]
    acceptanceTests: [QuotesHttpContractTest, ShipmentsHttpContractTest, TenantsHttpContractTest, ProblemDetailsHttpContractTest]
    negativeFixture: A response with an undocumented member, an impossible date-time, an invalid header or a problem title that is not its type's, and a status that the operation does not document and no path may give, fails validation (ContractTest).
    enforcedSubset: Every response that the HTTP tests exercise, of GET /api/v1/me, both quote operations, shipment booking/list/detail/label and the problems that any path can give, is validated against the contract in java, on the application with test doubles for its database adapters.
    plannedRemainder: Shipment cancellation, cancelled-state replay/label denial and the same responses from the PostgreSQL-backed application remain.
    docs: docs/adr/0012-first-runnable-slice-with-a-plain-typescript-workbench-and-spring-jdbc.md
  - id: control.web-import-boundaries
    title: Partial lint of detected web app imports for boundaries, cycles and a detected direct import for each REQUIRED relationship whose endpoints are built; every package and Node.js built-in a detected import names is whitelisted in the model and approved in the allowlist (ADR 0015).
    where: libs/c4-contract-kit, apps/shipping-web
    check: java
    status: partial
    target: v0.1
    evidence: [ImportScannerTest, SourceReaderTest, JsonTest, AppConfigurationTest, WebModelValidationTest, WebConformanceTest, WebReportDeterminismTest, WebArchitectureConformanceTest]
    acceptanceTests: [ImportScannerTest, SourceReaderTest, JsonTest, AppConfigurationTest, WebModelValidationTest, WebConformanceTest, WebReportDeterminismTest, WebArchitectureConformanceTest]
    negativeFixture: One synthetic web app per rule fails with exactly that violation (divergence, absence, a test that bridges parts, a production import of a test, unowned file, planned part with code, bypassed entry, undeclared or unapproved package, Node.js built-in in browser code, cycle, resolution override, unsupported syntax or file).
    evidenceLabel: the web import check's tests
    enforcedSubset: Each rule fails its synthetic negative fixture, and WebArchitectureConformanceTest runs the check on apps/shipping-web in every build, where a file under src in no part or in a planned part fails it; e2e tests are scanned and need declared and approved imports. This is partial lint over detected imports and reported refusals only; silent misses prevent complete boundary or cycle coverage.
    plannedRemainder: All six web parts are built and all ten REQUIRED relationships have production import evidence. Comparisons remain limited to detected imports; known spread-syntax bypasses remain open for literal and computed imports, require and unsupported import.meta. Compiler-graph boundary enforcement and browser verification of the strict CSP remain planned (ADRs 0015 and 0019); the web job compiles and tests policy text only.
    docs: docs/adr/0012-first-runnable-slice-with-a-plain-typescript-workbench-and-spring-jdbc.md
  - id: control.dependency-allowlist
    title: Reviewed dependencies and runtime CI engine guards; check 8 is PARTIAL lint with blocking container findings and non-blocking launch warnings.
    where: tools/policy, tools/ci, .github/workflows, security/
    check: java
    status: partial
    target: v0.1
