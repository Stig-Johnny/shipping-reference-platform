openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Shipping reference platform API
  version: 0.1.0
  summary: Quote, book and label parcels for one webshop tenant. Synthetic data and a simulated carrier only.
  description: |
    Contract-first (ADR 0004): this file is the authority for the HTTP interface of the API container
    (`architecture/workspace.dsl`, container `api`). Java controllers are written against it by hand;
    `*HttpContractTest` classes validate every response they exercise against it. The TypeScript client in
    `packages/shipping-client` is generated from it, and CI fails when regeneration produces a diff.
    Changing this file is a risk level 3 change (`policy/risk.json`).

    Tags name the owning module (`quotes`, `shipments`, `tenants`); see `docs/modules/<tag>.md`.

    ## Authentication (demo only)

    See the `demoBearer` security scheme. The tenant is always derived from the authenticated user's
    membership. No header, path segment, query parameter or body member can select or override a tenant.

    ## Conventions

    - All identifiers are lowercase UUID strings.
    - Timestamps are RFC 3339 date-times in UTC with a `Z` suffix, truncated to milliseconds.
    - Money amounts are decimal strings with exactly two fraction digits; `currency` is ISO 4217. v0.1 prices
      only in `EUR`.
    - Absent values are omitted. The contract uses no `null` values.
    - Unknown request members are rejected with `validation-failed` (every request object has
      `additionalProperties: false`, and the server enforces it).
    - Request bodies must be `application/json`. JSON responses are `application/json`; errors are
      `application/problem+json`; labels are `image/svg+xml`.
    - Every response carries `Correlation-Id` and `Cache-Control: no-store`. A client may send its own
      `Correlation-Id` (8 to 64 characters from `A-Z a-z 0-9 -`); otherwise the server generates a UUID.

    ## Errors (RFC 9457)

    Every error response is an `application/problem+json` document (schema `Problem`) with `type`, `title`,
    `status`, `detail`, `instance` (the request path) and `correlationId`. `type` values are stable URIs under
    `https://shipping-reference-platform.example/problems/`. The `.example` host is reserved (RFC 2606) and
    does not resolve; this table and `docs/modules/*.md` are the documentation for each type. Responses never
    contain stack traces, SQL, class names or data belonging to another tenant. A resource that exists in
    another tenant is reported exactly like a resource that does not exist.

    | type (suffix)                    | status | title                          | raised by                    |
    |----------------------------------|--------|--------------------------------|------------------------------|
    | `validation-failed`              | 400    | Request validation failed      | any module (has `errors`)    |
    | `malformed-request`              | 400    | Malformed request              | HTTP edge                    |
    | `unauthenticated`                | 401    | Authentication required        | tenants                      |
    | `no-tenant-membership`           | 403    | No tenant membership           | tenants                      |
    | `not-found`                      | 404    | Resource not found             | HTTP edge (unknown path)     |
    | `quote-not-found`                | 404    | Quote not found                | quotes, shipments            |
    | `offer-not-found`                | 404    | Offer not found                | shipments                    |
    | `shipment-not-found`             | 404    | Shipment not found             | shipments                    |
    | `method-not-allowed`             | 405    | Method not allowed             | HTTP edge                    |
    | `not-acceptable`                 | 406    | Not acceptable                 | HTTP edge                    |
    | `quote-already-booked`           | 409    | Quote already booked           | shipments                    |
    | `shipment-cancelled`             | 409    | Shipment cancelled             | shipments                    |
    | `unsupported-media-type`         | 415    | Unsupported media type         | HTTP edge                    |
    | `quote-expired`                  | 422    | Quote expired                  | shipments                    |
    | `recipient-does-not-match-quote` | 422    | Recipient does not match quote | shipments                    |
    | `idempotency-key-reused`         | 422    | Idempotency key reused         | shipments                    |
    | `no-offer-available`             | 422    | No offer available             | quotes (has `reason`)        |
    | `internal-error`                 | 500    | Internal error                 | HTTP edge                    |

    "HTTP edge" means the isolated classes `CorrelationIdFilter` and `FallbackProblemHandler` in the root
    package `io.github.stigjohnny.shipping` (container property `contract.isolated` in the C4 model).
    405 and the generic 404 can occur on any path and are not repeated under each operation.
  contact:
    name: Repository owner (see .github/CODEOWNERS)
servers:
  - url: /api/v1
    description: Same origin as the web app. Locally the Vite dev server proxies /api to the API on port 8080.
security:
  - demoBearer: []
tags:
  - name: tenants
    description: Who is calling and for which tenant. Owner module `tenants`.
  - name: quotes
    description: Price a parcel against the synthetic tariff. Owner module `quotes`.
  - name: shipments
    description: Book, read, cancel and label shipments. Owner module `shipments`.
paths:
  /me:
    get:
      operationId: getCurrentMembership
      tags: [tenants]
      summary: Return the authenticated user's tenant membership and enabled prototype flags.
      description: |
        Lets the web app confirm the chosen synthetic user and show the tenant name. `enabledFlags` lists the
        server-evaluated prototype flags that are on for this tenant (default off). Flags only change
        presentation; they never change authorization.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: The caller's membership.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              examples:
                clerkAlpha:
                  value:
                    userId: 00000000-0000-4000-8000-0000000000a1
                    userDisplayName: Clerk Alpha (synthetic)
                    tenantId: 11111111-1111-4111-8111-111111111111
                    tenantDisplayName: Tenant Alpha (synthetic)
                    role: CLERK
                    enabledFlags: [label-preview]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /quotes:
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Price a parcel and issue a quote with one offer per available service level.
      description: |
        Rates the parcel with the synthetic tariff (docs/modules/quotes.md): zone from the two countries,
        billable weight = max(actual grams, ceil(length x width x height in mm / 5000)), weight band, service
        level factor and a 7.5 % fuel surcharge, rounded half-up to cents. Every offer in the quote expires
        30 minutes after `issuedAt`. When `serviceLevel` is given, only that level is offered.

        Outcome when nothing can be offered: `422 no-offer-available` with `reason`; no quote is stored.
        Checks run in this order: route served, billable weight within 30000 g, requested level available.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              internationalAllLevels:
                value:
                  parcel: {weightGrams: 1200, lengthMm: 300, widthMm: 200, heightMm: 100}
                  origin: {countryCode: 'NO', postcode: '0150'}
                  destination: {countryCode: SE, postcode: '11122'}
      responses:
        '201':
          description: Quote issued. The quote is stored for the caller's tenant.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                internationalAllLevels:
                  value:
                    quoteId: 5b0f6c3e-2a43-4c1e-9d55-0d6f3e1a7b21
                    status: OPEN
                    issuedAt: '2026-11-10T09:00:00.000Z'
                    expiresAt: '2026-11-10T09:30:00.000Z'
                    parcel: {weightGrams: 1200, lengthMm: 300, widthMm: 200, heightMm: 100}
                    origin: {countryCode: 'NO', postcode: '0150'}
                    destination: {countryCode: SE, postcode: '11122'}
                    zone: INTERNATIONAL
                    billableWeightGrams: 1200
                    offers:
                      - offerId: 0e5b8a3c-7f0d-4b8e-8f3a-6c2d1e0f9a01
                        serviceLevel: ECONOMY
                        price: {amount: '15.05', currency: EUR}
                        transitDays: {minDays: 5, maxDays: 8}
                      - offerId: 0e5b8a3c-7f0d-4b8e-8f3a-6c2d1e0f9a02
                        serviceLevel: STANDARD
                        price: {amount: '18.81', currency: EUR}
                        transitDays: {minDays: 3, maxDays: 5}
                      - offerId: 0e5b8a3c-7f0d-4b8e-8f3a-6c2d1e0f9a03
                        serviceLevel: EXPRESS
                        price: {amount: '28.22', currency: EUR}
                        transitDays: {minDays: 1, maxDays: 2}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: '`no-offer-available`: the parcel cannot be offered on this route; `reason` says why.'
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                routeNotServed:
                  value:
                    type: https://shipping-reference-platform.example/problems/no-offer-available
                    title: No offer available
                    status: 422
                    detail: The route from NO to US is not served by the simulated carrier.
                    instance: /api/v1/quotes
                    correlationId: 3f2b9c1e-6a7d-4e8f-9b0a-1c2d3e4f5a6b
                    reason: ROUTE_NOT_SERVED
        '500':
          $ref: '#/components/responses/InternalError'
  /quotes/{quoteId}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Read a quote of the caller's tenant.
      description: |
        `status` is computed when the quote is read: `EXPIRED` when the server clock is at or after
        `expiresAt`, otherwise `OPEN`. A quote that belongs to another tenant returns `404 quote-not-found`.
      parameters:
        - $ref: '#/components/parameters/QuoteIdPath'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: The quote.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '404':
          $ref: '#/components/responses/QuoteNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /shipments:
    post:
      operationId: bookShipment
      tags: [shipments]
      summary: Book a shipment from one offer of an open quote. Idempotent per tenant and Idempotency-Key.
      description: |
        Exactly one shipment can be booked per quote. The server processes a booking in this order:

        1. Authenticate and resolve the tenant (401, 403).
        2. Validate the `Idempotency-Key` header and the body (400).
        3. Look up the key for this tenant. If it exists and the request fingerprint (SHA-256 of the canonical
           validated body) matches, return `200` with the current representation of the same shipment and
           `Idempotency-Replayed: true`, even if the quote has since expired or the shipment was cancelled.
           If the fingerprint differs, return `422 idempotency-key-reused`.
        4. Ask the quotes module for the offer at the server's current instant: unknown quote or quote of
           another tenant `404 quote-not-found`; offer not in the quote `404 offer-not-found`; clock at or after
           `expiresAt` `422 quote-expired`.
        5. The recipient's `countryCode` and `postcode` must equal the quote's destination
           (`422 recipient-does-not-match-quote`).
        6. A quote that already has a shipment under a different key returns `409 quote-already-booked`.
        7. Store the shipment in status `BOOKED` and publish `ShipmentBooked` in the same transaction; return
           `201`.

        Two concurrent requests with the same key produce one shipment: requests serialize by (tenant, key)
        before step 3 and then recheck the stored fingerprint. Keys are kept indefinitely in v0.1.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            examples:
              bookStandard:
                value:
                  quoteId: 5b0f6c3e-2a43-4c1e-9d55-0d6f3e1a7b21
                  offerId: 0e5b8a3c-7f0d-4b8e-8f3a-6c2d1e0f9a02
                  recipient:
                    name: Synthetic Recipient 1
                    addressLine1: 1 Example Street
                    postcode: '11122'
                    city: Exampleby
                    countryCode: SE
                  reference: ORDER-1001
      responses:
        '201':
          description: Shipment booked.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              examples:
                booked:
                  value:
                    shipmentId: 9d1c2b3a-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                    quoteId: 5b0f6c3e-2a43-4c1e-9d55-0d6f3e1a7b21
                    offerId: 0e5b8a3c-7f0d-4b8e-8f3a-6c2d1e0f9a02
                    status: BOOKED
                    serviceLevel: STANDARD
                    price: {amount: '18.81', currency: EUR}
                    trackingNumber: SIM0000000001
                    origin: {countryCode: 'NO', postcode: '0150'}
                    recipient:
                      name: Synthetic Recipient 1
                      addressLine1: 1 Example Street
                      postcode: '11122'
                      city: Exampleby
                      countryCode: SE
                    reference: ORDER-1001
                    bookedAt: '2026-11-10T09:05:00.000Z'
        '200':
          description: Replay of an earlier booking with the same Idempotency-Key and the same body.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '404':
          description: '`quote-not-found` or `offer-not-found`.'
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: '`quote-already-booked`: the quote already has a shipment booked under a different key.'
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: '`quote-expired`, `recipient-does-not-match-quote` or `idempotency-key-reused`.'
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                expired:
                  value:
                    type: https://shipping-reference-platform.example/problems/quote-expired
                    title: Quote expired
                    status: 422
                    detail: The quote expired at 2026-11-10T09:30:00.000Z. Request a fresh quote.
                    instance: /api/v1/shipments
                    correlationId: 7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List the caller's tenant's shipments, newest first.
      description: |
        Ordered by `bookedAt` descending, then `shipmentId` descending. Cursor pagination: pass `nextCursor`
        from the previous page as `cursor`; the last page omits `nextCursor`. A cursor is opaque, bound to the
        tenant and to the `status` filter it was issued with; a cursor that does not decode for this tenant and
        filter returns `400 validation-failed`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: One page of shipments. An empty `items` array means the tenant has no matching shipments.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /shipments/{shipmentId}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Read one shipment of the caller's tenant.
      parameters:
        - $ref: '#/components/parameters/ShipmentIdPath'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: The shipment.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /shipments/{shipmentId}/cancellation:
    post:
      operationId: cancelShipment
      tags: [shipments]
      summary: Cancel a booked shipment. Idempotent.
      description: |
        Transition `BOOKED` to `CANCELLED`, record `cancelledAt` and publish `ShipmentCancelled` in the same
        transaction. Cancelling a shipment that is already `CANCELLED` returns `200` with the unchanged shipment
        and publishes nothing. The request has no body.
      parameters:
        - $ref: '#/components/parameters/ShipmentIdPath'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: The shipment, now `CANCELLED`.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /shipments/{shipmentId}/label:
    get:
      operationId: getShipmentLabel
      tags: [shipments]
      summary: Download the simulated label of a booked shipment as SVG.
      description: |
        Format choice: `image/svg+xml`, not `application/pdf`. The server renders SVG with plain, escaped text
        templating: no PDF library to review and allowlist, byte-identical output for the same shipment (golden
        file tests), text that diffs and searches, and native rendering in browsers. A real carrier would require
        its own format (often PDF or a printer language); that is out of scope (docs/gaps.md).

        The label is rendered on request from the stored shipment and is not stored. It is visibly marked
        `SIMULATED LABEL - NOT VALID FOR CARRIAGE`; the bar pattern is decorative and not a scannable barcode.
        The SVG contains no scripts, no `<style>` elements, no event attributes and no external references.
        Defence in depth: `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` and
        `Content-Security-Policy: default-src 'none'; sandbox`. A `CANCELLED` shipment has no label
        (`409 shipment-cancelled`).
      parameters:
        - $ref: '#/components/parameters/ShipmentIdPath'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      responses:
        '200':
          description: The label document, 100 mm x 150 mm.
          headers:
            Content-Disposition:
              description: Always `attachment; filename="label-<trackingNumber>.svg"`.
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="label-SIM[0-9]{10}\.svg"$'
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
            Content-Security-Policy:
              required: true
              schema:
                type: string
                const: default-src 'none'; sandbox
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
                maxLength: 65536
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NoTenantMembership'
        '404':
          $ref: '#/components/responses/ShipmentNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: '`shipment-cancelled`: a cancelled shipment has no label.'
          headers:
            Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    demoBearer:
      type: http
      scheme: bearer
      bearerFormat: 'demo-<user handle>'
      description: |
        Demo-only authentication for synthetic users. Send `Authorization: Bearer <token>`.

        - Each synthetic user has one fixed token of the form `demo-<user handle>` (pattern
          `^demo-[a-z0-9-]{3,40}$`), for example the user `clerk-alpha` uses `demo-clerk-alpha`. The tokens are
          public test fixtures, deliberately guessable, and are listed in `docs/modules/tenants.md`.
        - The server stores only SHA-256 hashes of tokens. It resolves a token to a user and that user's single
          tenant membership through a database function the application role may execute but whose tables it
          cannot read. The tenant used for every query comes from that membership.
        - The scheme is registered only when the `demo` Spring profile is active. Without it, every request
          returns `401 unauthenticated`.

        Limits, stated plainly: anyone who can read this repository can act as any synthetic user. There is no
        expiry, rotation, revocation, multi-factor authentication, rate limiting or lockout, and local runs use
        plain HTTP. This proves tenant derivation from membership and tenant isolation. It does not prove
        authentication strength. Production identity (for example OpenID Connect) is a listed gap.
  parameters:
    QuoteIdPath:
      name: quoteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/QuoteId'
    ShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ShipmentId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-chosen key, unique per intended booking. Scope: the caller's tenant. The same key with the same
        body returns the same shipment; the same key with a different body returns `422 idempotency-key-reused`.
        A UUID is a good choice. Missing or malformed keys return `400 validation-failed` with `in: header`.
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]{16,64}$'
      example: 6f1d2c3b-4a5e-4f60-8172-93a4b5c6d7e8
    CorrelationIdRequest:
      name: Correlation-Id
      in: header
      required: false
      description: Optional client correlation identifier. Reused when valid; otherwise the server generates one.
      schema:
        $ref: '#/components/schemas/CorrelationId'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    StatusFilter:
      name: status
      in: query
      required: false
      description: Only return shipments in this status.
      schema:
        $ref: '#/components/schemas/ShipmentStatus'
  headers:
    CorrelationId:
      description: The request's correlation identifier, also present as `correlationId` in problem bodies.
      required: true
      schema:
        $ref: '#/components/schemas/CorrelationId'
    Location:
      description: Absolute path of the created or replayed resource, for example `/api/v1/quotes/{quoteId}`.
      required: true
      schema:
        type: string
        format: uri-reference
        pattern: '^/api/v1/(quotes|shipments)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    IdempotencyReplayed:
      description: Present with value `true` only on a replayed booking.
      required: true
      schema:
        type: string
        const: 'true'
    WwwAuthenticate:
      description: RFC 6750 challenge.
      required: true
      schema:
        type: string
        const: Bearer realm="shipping-reference-platform"
  responses:
    BadRequest:
      description: '`validation-failed` (with `errors`) or `malformed-request` (body is not parseable JSON).'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            weightTooHigh:
              value:
                type: https://shipping-reference-platform.example/problems/validation-failed
                title: Request validation failed
                status: 400
                detail: The request has 1 invalid value.
                instance: /api/v1/quotes
                correlationId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                errors:
                  - in: body
                    name: /parcel/weightGrams
                    detail: must be between 1 and 30000
    Unauthenticated:
      description: '`unauthenticated`: missing, malformed or unknown bearer token.'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoTenantMembership:
      description: '`no-tenant-membership`: the user is authenticated but belongs to no tenant.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuoteNotFound:
      description: '`quote-not-found`: no such quote for the caller''s tenant.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShipmentNotFound:
      description: '`shipment-not-found`: no such shipment for the caller''s tenant.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: '`not-acceptable`: the `Accept` header excludes every media type this operation produces.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: '`unsupported-media-type`: the request body is not `application/json`.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: '`internal-error`: an unexpected failure. `detail` is generic; details are logged with the correlation ID.'
      headers:
        Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    QuoteId:
      $ref: '#/components/schemas/Uuid'
      description: Identifier of a quote. Java type `io.github.stigjohnny.shipping.quotes.api.QuoteId`.
    OfferId:
      $ref: '#/components/schemas/Uuid'
      description: Identifier of an offer within a quote. Java type `io.github.stigjohnny.shipping.quotes.api.OfferId`.
    ShipmentId:
      $ref: '#/components/schemas/Uuid'
      description: Identifier of a shipment. Java type `io.github.stigjohnny.shipping.shipments.api.ShipmentId`.
    TenantId:
      $ref: '#/components/schemas/Uuid'
      description: Identifier of a tenant. Java type `io.github.stigjohnny.shipping.tenants.api.TenantId`.
    UserId:
      $ref: '#/components/schemas/Uuid'
      description: Identifier of a synthetic user. Java type `io.github.stigjohnny.shipping.tenants.api.UserId`.
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      description: UTC instant truncated to milliseconds.
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9-]{8,64}$'
    Cursor:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9_-]{1,200}$'
      description: Opaque pagination cursor (base64url without padding).
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: |
        ISO 3166-1 alpha-2, upper case. Any well-formed code is accepted; the simulated carrier serves only
        DE, DK, FI, NL, NO and SE. Other codes make `createQuote` return `422 no-offer-available` with reason
        `ROUTE_NOT_SERVED`.
    Postcode:
      type: string
      minLength: 2
      maxLength: 10
      pattern: '^[A-Z0-9][A-Z0-9 -]{0,8}[A-Z0-9]$'
      description: Upper case letters, digits, space and hyphen. Not validated per country in v0.1 (docs/gaps.md).
    Place:
      type: object
      additionalProperties: false
      required: [countryCode, postcode]
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        postcode:
          $ref: '#/components/schemas/Postcode'
    Parcel:
      type: object
      additionalProperties: false
      required: [weightGrams, lengthMm, widthMm, heightMm]
      properties:
        weightGrams:
          type: integer
          format: int32
          minimum: 1
          maximum: 30000
          description: Actual weight in grams.
        lengthMm:
          type: integer
          format: int32
          minimum: 1
          maximum: 1200
        widthMm:
          type: integer
          format: int32
          minimum: 1
          maximum: 1200
        heightMm:
          type: integer
          format: int32
          minimum: 1
          maximum: 1200
    ServiceLevel:
      type: string
      enum: [ECONOMY, STANDARD, EXPRESS]
      description: EXPRESS is offered only up to 10000 g billable weight.
    Zone:
      type: string
      enum: [DOMESTIC, INTERNATIONAL]
      description: DOMESTIC when origin and destination countries are equal, otherwise INTERNATIONAL.
    QuoteStatus:
      type: string
      enum: [OPEN, EXPIRED]
    UnavailableReason:
      type: string
      enum: [ROUTE_NOT_SERVED, BILLABLE_WEIGHT_ABOVE_LIMIT, SERVICE_LEVEL_NOT_AVAILABLE]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,8})\.[0-9]{2}$'
          description: Non-negative decimal with exactly two fraction digits.
        currency:
          type: string
          enum: [EUR]
    TransitDays:
      type: object
      additionalProperties: false
      required: [minDays, maxDays]
      description: Simulated transit time in calendar days; `maxDays` is never less than `minDays`.
      properties:
        minDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        maxDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [parcel, origin, destination]
      properties:
        parcel:
          $ref: '#/components/schemas/Parcel'
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        serviceLevel:
          $ref: '#/components/schemas/ServiceLevel'
    Offer:
      type: object
      additionalProperties: false
      required: [offerId, serviceLevel, price, transitDays]
      properties:
        offerId:
          $ref: '#/components/schemas/OfferId'
        serviceLevel:
          $ref: '#/components/schemas/ServiceLevel'
        price:
          $ref: '#/components/schemas/Money'
        transitDays:
          $ref: '#/components/schemas/TransitDays'
    Quote:
      type: object
      additionalProperties: false
      required:
        [quoteId, status, issuedAt, expiresAt, parcel, origin, destination, zone, billableWeightGrams, offers]
      properties:
        quoteId:
          $ref: '#/components/schemas/QuoteId'
        status:
          $ref: '#/components/schemas/QuoteStatus'
        issuedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        parcel:
          $ref: '#/components/schemas/Parcel'
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        zone:
          $ref: '#/components/schemas/Zone'
        billableWeightGrams:
          type: integer
          format: int32
          minimum: 1
          maximum: 30000
          description: max(weightGrams, ceil(lengthMm x widthMm x heightMm / 5000)). Never above 30000 in a stored quote.
        offers:
          type: array
          minItems: 1
          maxItems: 3
          description: One offer per available service level, ordered ECONOMY, STANDARD, EXPRESS.
          items:
            $ref: '#/components/schemas/Offer'
    Recipient:
      type: object
      additionalProperties: false
      required: [name, addressLine1, postcode, city, countryCode]
      description: Personal data. Use synthetic values only. Never logged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 70
          pattern: '^[^\u0000-\u001F\u007F]+$'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 70
          pattern: '^[^\u0000-\u001F\u007F]+$'
        addressLine2:
          type: string
          minLength: 1
          maxLength: 70
          pattern: '^[^\u0000-\u001F\u007F]+$'
        postcode:
          $ref: '#/components/schemas/Postcode'
        city:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[^\u0000-\u001F\u007F]+$'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
    ShipmentReference:
      type: string
      minLength: 1
      maxLength: 35
      pattern: '^[A-Za-z0-9 ._/-]+$'
      description: The webshop's own reference, for example an order number.
    BookingRequest:
      type: object
      additionalProperties: false
      required: [quoteId, offerId, recipient]
      properties:
        quoteId:
          $ref: '#/components/schemas/QuoteId'
        offerId:
          $ref: '#/components/schemas/OfferId'
        recipient:
          $ref: '#/components/schemas/Recipient'
        reference:
          $ref: '#/components/schemas/ShipmentReference'
    ShipmentStatus:
      type: string
      enum: [BOOKED, CANCELLED]
      description: |
        v0.1 lifecycle: BOOKED -> CANCELLED. Later values (for example IN_TRANSIT, DELIVERED from the planned
        tracking module) will be added by a contract change.
    TrackingNumber:
      type: string
      pattern: '^SIM[0-9]{10}$'
      description: Simulated tracking number, unique per tenant. The SIM prefix marks it as not a carrier number.
    Shipment:
      type: object
      additionalProperties: false
      required:
        [shipmentId, quoteId, offerId, status, serviceLevel, price, trackingNumber, origin, recipient, bookedAt]
      properties:
        shipmentId:
          $ref: '#/components/schemas/ShipmentId'
        quoteId:
          $ref: '#/components/schemas/QuoteId'
        offerId:
          $ref: '#/components/schemas/OfferId'
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        serviceLevel:
          $ref: '#/components/schemas/ServiceLevel'
        price:
          $ref: '#/components/schemas/Money'
        trackingNumber:
          $ref: '#/components/schemas/TrackingNumber'
        origin:
          $ref: '#/components/schemas/Place'
        recipient:
          $ref: '#/components/schemas/Recipient'
        reference:
          $ref: '#/components/schemas/ShipmentReference'
        bookedAt:
          $ref: '#/components/schemas/Timestamp'
        cancelledAt:
          $ref: '#/components/schemas/Timestamp'
          description: Present if and only if `status` is CANCELLED.
    ShipmentSummary:
      type: object
      additionalProperties: false
      required: [shipmentId, status, serviceLevel, price, trackingNumber, recipientName, destination, bookedAt]
      properties:
        shipmentId:
          $ref: '#/components/schemas/ShipmentId'
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        serviceLevel:
          $ref: '#/components/schemas/ServiceLevel'
        price:
          $ref: '#/components/schemas/Money'
        trackingNumber:
          $ref: '#/components/schemas/TrackingNumber'
        recipientName:
          type: string
          minLength: 1
          maxLength: 70
        destination:
          $ref: '#/components/schemas/Place'
        reference:
          $ref: '#/components/schemas/ShipmentReference'
        bookedAt:
          $ref: '#/components/schemas/Timestamp'
    ShipmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShipmentSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    FlagKey:
      type: string
      enum: [label-preview]
      description: |
        Server-evaluated, tenant-scoped prototype flags. Default off; each has an owner and an expiry date in
        `docs/modules/tenants.md`. `label-preview` shows an inline label preview in the shipment drawer.
    Membership:
      type: object
      additionalProperties: false
      required: [userId, userDisplayName, tenantId, tenantDisplayName, role, enabledFlags]
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        userDisplayName:
          type: string
          minLength: 1
          maxLength: 70
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantDisplayName:
          type: string
          minLength: 1
          maxLength: 70
        role:
          type: string
          enum: [CLERK]
        enabledFlags:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/FlagKey'
    ProblemType:
      type: string
      format: uri
      enum:
        - https://shipping-reference-platform.example/problems/validation-failed
        - https://shipping-reference-platform.example/problems/malformed-request
        - https://shipping-reference-platform.example/problems/unauthenticated
        - https://shipping-reference-platform.example/problems/no-tenant-membership
        - https://shipping-reference-platform.example/problems/not-found
        - https://shipping-reference-platform.example/problems/quote-not-found
        - https://shipping-reference-platform.example/problems/offer-not-found
        - https://shipping-reference-platform.example/problems/shipment-not-found
        - https://shipping-reference-platform.example/problems/method-not-allowed
        - https://shipping-reference-platform.example/problems/not-acceptable
        - https://shipping-reference-platform.example/problems/quote-already-booked
        - https://shipping-reference-platform.example/problems/shipment-cancelled
        - https://shipping-reference-platform.example/problems/unsupported-media-type
        - https://shipping-reference-platform.example/problems/quote-expired
        - https://shipping-reference-platform.example/problems/recipient-does-not-match-quote
        - https://shipping-reference-platform.example/problems/idempotency-key-reused
        - https://shipping-reference-platform.example/problems/no-offer-available
        - https://shipping-reference-platform.example/problems/internal-error
    InvalidParam:
      type: object
      additionalProperties: false
      required: [in, name, detail]
      properties:
        in:
          type: string
          enum: [body, query, path, header]
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A JSON Pointer (RFC 6901) into the body when `in` is `body`; otherwise the parameter name.
        detail:
          type: string
          minLength: 1
          maxLength: 300
    Problem:
      type: object
      additionalProperties: false
      description: |
        RFC 9457 problem details. `status` equals the HTTP status code. `title` is fixed per `type`. `detail` is
        safe to show to the user. `instance` is the request path without query string. `errors` appears only
        with `validation-failed`; `reason` appears only with `no-offer-available`.
      required: [type, title, status, detail, instance, correlationId]
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 500
        instance:
          type: string
          format: uri-reference
          maxLength: 2048
        correlationId:
          $ref: '#/components/schemas/CorrelationId'
        errors:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/InvalidParam'
        reason:
          $ref: '#/components/schemas/UnavailableReason'
